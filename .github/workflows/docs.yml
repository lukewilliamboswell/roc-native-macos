name: Documentation

# The manual (docs/index.adoc) as a website, static Markdown and a PDF, built
# by `blueprint run docs` with roc-automation's released roc-docs renderer,
# which Blueprint.lock pins by digest. A pull request builds it, so a broken
# manual fails review and the artifact previews the change; the default
# branch deploys it to GitHub Pages. The build job runs on macos-15 because
# Blueprint.roc declares Apple silicon macOS as its one system.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the manual
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@acc5efdcd929b38e665cd3ae6e694d1c4887f9c7
      - run: blueprint run docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .docs-out/site

  # Holds only the Pages permissions, checks out nothing and runs no
  # repository code: it deploys the artifact the build job produced.
  deploy:
    name: Deploy the manual
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
